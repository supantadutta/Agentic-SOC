[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-soc"
version = "0.1.0"
description = "Low-cost agentic Security Operations Center: Wazuh + threat intelligence + LLM triage + policy-governed response."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
cloud = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "anthropic>=1.0"]

[project.scripts]
agentic-soc-eval = "evaluation.run_evaluation:main"
agentic-soc-cost = "evaluation.cost_model:main"

[tool.setuptools.packages.find]
include = ["agentic_soc*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"evaluation/*" = ["S311"]
