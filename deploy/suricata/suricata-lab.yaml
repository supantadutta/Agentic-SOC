%YAML 1.1
---
# Included from /etc/suricata/suricata.yaml (later keys override earlier ones).
# Verify with: suricata -T -c /etc/suricata/suricata.yaml -v

vars:
  address-groups:
    HOME_NET: "[192.168.50.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

af-packet:
  - interface: __CAPTURE_IF__
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes

outputs:
  # Full-fidelity EVE log stays on the sensor for investigation.
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      community-id: yes
      types:
        - alert
        - anomaly
        - http
        - dns
        - tls
        - fileinfo
        - flow
  # Selected events only, read by the Wazuh agent (deploy/wazuh/agents/ossec-agent-sensor.xml).
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve-wazuh.json
      community-id: yes
      types:
        - alert:
            metadata: yes
        - anomaly
