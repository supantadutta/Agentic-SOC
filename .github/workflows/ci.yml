name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m evaluation.run_evaluation --provider heuristic --out results/ci
      - name: Shell syntax check
        run: bash -n deploy/wazuh/active-response/linux/*.sh deploy/*/*.sh
